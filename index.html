<h1>在庫管理ツール</h1>
<p>個人の物販業務のために作った、自分専用の在庫・損益管理ツールです。一般の方向けのサービスではなく、利用者は開発者本人だけです。</p>
<h2>Google アカウントで行うこと</h2>
<ul>
  <li>Gmail の注文確認メールを読み取り、仕入れの記録の下書きを作る</li>
  <li>受信トレイのメールを仕分ける（メールマガジンをアーカイブしてラベルを付ける、など）</li>
  <li>抽選の受付・当選メールに書かれた日付を、Google カレンダーに予定として登録する</li>
</ul>
<p>メールの送信や削除は行いません。</p>
